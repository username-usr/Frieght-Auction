name: Deploy to Cloudflare Workers

# Every push to main rebuilds and redeploys the Worker.
# Manual runs are allowed too, for redeploying without a code change.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-workers
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # NEXT_PUBLIC_* values are inlined into the bundle by Next at BUILD time,
      # so they have to be present here — setting them as Worker secrets later
      # does nothing for them. The server-only secrets (service-role key, Twilio
      # token, session secret) are NOT needed here: they are read at runtime
      # from the Worker's own secret store. Keep them out of CI.
      - name: Build for Workers
        run: npx opennextjs-cloudflare build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
